<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Happy Birthday 🎂</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Be+Vietnam+Pro:wght@400;500;600&family=Quicksand:wght@500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <canvas id="fx" aria-hidden="true"></canvas>

  <header class="hero" id="hero">
    <div class="bunting" id="bunting" aria-hidden="true"></div>
    <div id="deco" aria-hidden="true"></div>
    <h1 class="title" id="title" aria-label="Happy Birthday"></h1>
    <button class="cakeb" id="open" aria-label="Bấm vào bánh để mở thiệp">
      <span class="tap" aria-hidden="true">👆</span>
      <span class="cake" aria-hidden="true">
        <i class="ly ly1"></i>
        <i class="ly ly2"></i>
        <i class="ly ly3"><svg viewBox="0 0 240 36" preserveAspectRatio="none">
            <path
              d="M0 0H240V14C234 14 234 30 222 30C210 30 214 16 202 16C190 16 194 34 180 34C166 34 170 18 158 18C146 18 150 28 138 28C126 28 130 12 118 12C106 12 108 30 94 30C80 30 84 16 72 16C60 16 64 28 50 28C38 28 40 14 28 14C16 14 18 24 8 24C4 24 2 22 0 20Z"
              fill="#ff7fa0" />
          </svg></i>
        <i class="cd cd1"><b></b></i><i class="cd cd2"><b></b></i><i class="cd cd3"><b></b></i>
        <i class="plate"></i>
      </span>
    </button>
  </header>

  <main class="stage">
    <article class="card" id="card" data-m="cat">
      <button class="x" id="close" aria-label="Đóng thiệp">✕</button>
      <div class="pg l">
        <h2 id="hello">Gửi bạn,</h2>
        <p id="msg1"></p>
        <p id="msg2"></p>
        <p class="sign" id="sign"></p>
        <figure class="polaroid">
          <div class="photo">
            <svg class="bear" viewBox="0 -16 200 196" role="img" aria-label="Linh vật đội mũ tiệc đưa bó hoa tặng bạn">
              <defs>
                <g id="fl">
                  <g stroke="#1d1a1f" stroke-width="2">
                    <circle cx="0" cy="-7" r="5.5" fill="currentColor" />
                    <circle cx="6.6" cy="-2.2" r="5.5" fill="currentColor" />
                    <circle cx="4" cy="5.7" r="5.5" fill="currentColor" />
                    <circle cx="-4" cy="5.7" r="5.5" fill="currentColor" />
                    <circle cx="-6.6" cy="-2.2" r="5.5" fill="currentColor" />
                    <circle r="4.2" fill="#ffc94d" />
                  </g>
                </g>
              </defs>
              <g class="bbody" stroke="#1d1a1f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
                <g class="v v-cat">
                  <path d="M46 152q-38 6-30-32" fill="none" stroke-width="16" />
                  <path class="fur-s" d="M46 152q-38 6-30-32" fill="none" stroke-width="10" />
                </g>
                <ellipse class="fur" cx="80" cy="140" rx="44" ry="32" />
                <ellipse class="belly" cx="80" cy="144" rx="26" ry="20" />
                <ellipse class="fur" cx="40" cy="138" rx="11" ry="17" transform="rotate(25 40 138)" />
                <g class="bhead">
                  <g class="v v-cat earl">
                    <polygon class="fur" points="34,66 36,22 70,42" />
                    <polygon class="inner" points="42,56 42,34 58,44" />
                  </g>
                  <g class="v v-cat earr">
                    <polygon class="fur" points="126,66 124,22 90,42" />
                    <polygon class="inner" points="118,56 118,34 102,44" />
                  </g>
                  <circle class="fur" cx="80" cy="76" r="48" />
                  <g class="v v-cat">
                    <path d="M75 82h10l-5 6z" fill="#ff7fa0" stroke-width="2.5" />
                    <path d="M84 91.5L90 92L87.2 98.8z" fill="#fff" stroke-width="2" />
                    <path d="M80 88q-4 7-11 3M80 88q4 7 11 3" fill="none" />
                    <path d="M36 84l-16-4M36 92l-16 4M124 84l16-4M124 92l16 4" fill="none" stroke-width="2.5" />
                  </g>
                  <g class="eyes" stroke="none">
                    <circle cx="62" cy="72" r="6.5" fill="#1d1a1f" />
                    <circle cx="98" cy="72" r="6.5" fill="#1d1a1f" />
                    <circle cx="60" cy="69.5" r="2.4" fill="#fff" />
                    <circle cx="96" cy="69.5" r="2.4" fill="#fff" />
                    <circle cx="64" cy="74.5" r="1.2" fill="#fff" />
                    <circle cx="100" cy="74.5" r="1.2" fill="#fff" />
                  </g>
                  <ellipse class="blush" cx="48" cy="90" rx="9" ry="5.5" fill="#ff7fa0" opacity=".65" stroke="none" />
                  <ellipse class="blush" cx="112" cy="90" rx="9" ry="5.5" fill="#ff7fa0" opacity=".65" stroke="none" />
                  <g class="v v-hat">
                    <polygon points="80,8 59,44 101,44" fill="#dc3a45" />
                    <path d="M68 28l24 0M63 37l34 0" stroke="#ffc94d" stroke-width="3" fill="none" />
                    <circle cx="80" cy="8" r="6.5" fill="#ffc94d" />
                  </g>
                </g>
                <g class="give">
                  <line x1="108" y1="128" x2="136" y2="140" stroke="#1d1a1f" stroke-width="25" />
                  <line class="fur-s" x1="108" y1="128" x2="136" y2="140" stroke-width="19" />
                  <g class="bq">
                    <path d="M136 136L131 98M136 136L148 96M136 136L162 108" stroke="#3fa66b" stroke-width="3.5"
                      fill="none" />
                    <path d="M142 118q10-4 14 4q-10 4-14-4z" fill="#6fd8a0" stroke-width="2" />
                    <use href="#fl" style="color:#ff7fa0" transform="translate(131 96)" />
                    <use href="#fl" style="color:#ff5c7a" transform="translate(149 93) scale(1.1)" />
                    <use href="#fl" style="color:#fdf0d6" transform="translate(164 108) scale(.95)" />
                    <path d="M136 132l-9-6v12zM136 132l9-6v12z" fill="#dc3a45" stroke-width="2" />
                  </g>
                  <circle class="fur" cx="137" cy="141" r="10" />
                </g>
              </g>
              <text class="hp hp1" x="150" y="78" font-size="16" fill="#ff5c7a" stroke="none">♥</text>
              <text class="hp hp2" x="170" y="92" font-size="12" fill="#ffc94d" stroke="none">♥</text>
            </svg>
          </div>
          <figcaption id="cap"></figcaption>
        </figure>

      </div>
      <div class="pg r">
        <div id="invite">
          <h2>Đi chơi với mình nhé?</h2>
          <fieldset>
            <legend>Bạn rảnh ngày nào?</legend><input type="date" id="date" aria-label="Ngày đi chơi">
          </fieldset>
          <fieldset>
            <legend>Mấy giờ thì hợp?</legend>
            <div class="timepick">
              <svg class="cc" id="cc" viewBox="0 0 96 84" aria-hidden="true">
                <g class="tail" fill="none" stroke-linecap="round">
                  <path d="M62 64q24 8 22-18" stroke="#1d1a1f" stroke-width="12" />
                  <path d="M62 64q24 8 22-18" stroke="#ffc48a" stroke-width="6" />
                </g>
                <g stroke="#1d1a1f" stroke-width="3" stroke-linejoin="round">
                  <polygon points="10,28 12,4 34,17" fill="#ffc48a" />
                  <polygon points="70,28 68,4 46,17" fill="#ffc48a" />
                  <circle cx="40" cy="44" r="32" fill="#fffdf8" />
                </g>
                <g fill="#1d1a1f">
                  <circle cx="40" cy="18" r="2" />
                  <circle cx="66" cy="44" r="2" />
                  <circle cx="40" cy="70" r="2" />
                  <circle cx="14" cy="44" r="2" />
                </g>
                <ellipse cx="21" cy="58" rx="5" ry="3" fill="#ff9fb4" opacity=".6" />
                <ellipse cx="59" cy="58" rx="5" ry="3" fill="#ff9fb4" opacity=".6" />
                <g class="hand" id="hh">
                  <line x1="40" y1="44" x2="40" y2="31" stroke="#1d1a1f" stroke-width="4.5" stroke-linecap="round" />
                </g>
                <g class="hand" id="mh">
                  <line x1="40" y1="44" x2="40" y2="22" stroke="#e0365f" stroke-width="3.2" stroke-linecap="round" />
                </g>
                <circle cx="40" cy="44" r="3.5" fill="#ffc94d" stroke="#1d1a1f" stroke-width="2.5" />
              </svg>
              <div class="tcol"><input type="time" id="time" value="19:00" aria-label="Giờ đi chơi"><span class="tod"
                  id="tod"></span></div>
            </div>
          </fieldset>
          <fieldset>
            <legend>Hồng muốn đi đâu?</legend>
            <div class="chips" id="places"></div>
          </fieldset>
          <div class="actions" id="actions">
            <button class="btn" id="yes">Đồng ý, đi thôi!</button>
            <button class="btn ghost" id="no">Để mình nghĩ thêm</button>
          </div>
        </div>
        <div class="done" id="done">
          <h2>Cảm ơn bạn nhiều lắm! ❤️</h2>
          <p>Thông tin hẹn hò đã được gửi thành công ✨ Hẹn gặp lại nhé! 🎉</p>
        </div>
      </div>
    </article>
  </main>

  <script src="script.js"></script>
</body>

</html>
